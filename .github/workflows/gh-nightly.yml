name: Build and Release Nightly

on:
  schedule:
    # Run daily at 00:00 UTC for nightly builds
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Tingly-Box ref to build (commit, branch, or tag, e.g., main, v1.0.0, abc123). Leave empty to auto-fetch latest tag.'
        required: false
        type: string
        default: ''
      npm_version:
        description: 'NPM version to publish (optional, defaults to auto-generated version)'
        required: false
        type: string
        default: ''
      build_gui:
        description: 'Build GUI version'
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      upstream_ref: ${{ steps.set_vars.outputs.upstream_ref }}
      build_gui: ${{ steps.set_vars.outputs.build_gui }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      tingly_box_commit: ${{ steps.get_commit.outputs.commit }}
      npm_version: ${{ steps.version.outputs.npm_version }}
    steps:
      - name: Checkout tingly-box-nightly repository
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box-nightly
          ref: main
          fetch-depth: 1

      - name: Fetch latest tag from tingly-box
        id: fetch_tag
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest tag from tingly-dev/tingly-box..."

          # Get latest matching tag (v* format, sorted by version)
          LATEST_TAG=$(gh api repos/tingly-dev/tingly-box/git/refs/tags \
            --jq '.[].ref' \
            --jq 'select(. | startswith("refs/tags/v"))' \
            | sed 's/refs\/tags\///g' \
            | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, falling back to main branch"
            echo "upstream_ref=main" >> $GITHUB_OUTPUT
          else
            echo "Latest tag: $LATEST_TAG"
            echo "upstream_ref=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Set variables
        id: set_vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Use fetched tag from previous step
            UPSTREAM="${{ steps.fetch_tag.outputs.upstream_ref }}"
            echo "upstream_ref=$UPSTREAM" >> $GITHUB_OUTPUT
            echo "build_gui=false" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_REF="${{ github.event.inputs.upstream_ref }}"
            if [ -z "$INPUT_REF" ]; then
              # Empty input, fetch latest tag
              echo "Fetching latest tag..."
              LATEST_TAG=$(gh api repos/tingly-dev/tingly-box/git/refs/tags \
                --jq '.[].ref' \
                --jq 'select(. | startswith("refs/tags/v"))' \
                | sed 's/refs\/tags\///g' \
                | sort -V | tail -1)
              if [ -z "$LATEST_TAG" ]; then
                echo "upstream_ref=main" >> $GITHUB_OUTPUT
              else
                echo "upstream_ref=$LATEST_TAG" >> $GITHUB_OUTPUT
              fi
            else
              echo "upstream_ref=$INPUT_REF" >> $GITHUB_OUTPUT
            fi
            echo "build_gui=${{ github.event.inputs.build_gui }}" >> $GITHUB_OUTPUT
          else
            echo "upstream_ref=main" >> $GITHUB_OUTPUT
            echo "build_gui=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout tingly-box to get commit hash
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box
          ref: ${{ steps.set_vars.outputs.upstream_ref }}
          fetch-depth: 1
          path: upstream-tingly-box

      - name: Get commit hash
        id: get_commit
        run: |
          # Get short commit hash from upstream repository
          cd upstream-tingly-box
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          echo "commit=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Determine release tag
        id: determine_tag
        run: |
          # Check if npm_version was provided
          NPM_VERSION_INPUT="${{ github.event.inputs.npm_version }}"
          if [ -n "$NPM_VERSION_INPUT" ]; then
            # Use npm_version as the base for release_tag
            # Add 'v' prefix for release_tag consistency
            RELEASE_TAG="v${NPM_VERSION_INPUT}"
          else
            # Generate version: 0.YYYYMMDD.HHmm-nightly+<commit>
            NIGHTLY_DATE=$(date -u '+%Y%m%d')
            NIGHTLY_TIME=$(date -u '+%H%M')
            VERSION="0.${NIGHTLY_DATE}.${NIGHTLY_TIME}-nightly+${{ steps.get_commit.outputs.commit }}"
            RELEASE_TAG="$VERSION"
          fi

          # Use heredoc to safely set output with special characters
          {
            echo "release_tag<<EOF"
            echo "$RELEASE_TAG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Validate and extract version
        id: version
        uses: ./.github/actions/validate-version
        with:
          release_tag: ${{ steps.determine_tag.outputs.release_tag }}
          npm_version: ${{ github.event.inputs.npm_version }}

  build-frontend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tingly-box source code
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box
          ref: ${{ needs.setup.outputs.upstream_ref }}
          fetch-depth: 0
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Run codegen and build frontend
        run: |
          pnpm gen:api
          pnpm build && mkdir -p ../internal/web/dist && cp -R dist/* ../internal/web/dist/
        working-directory: ./frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/
          retention-days: 7

  build-cli:
    needs: [setup, build-frontend]
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            runs-on: ubuntu-latest
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
            runs-on: macos-latest
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            exe: .exe
            runs-on: windows-latest
    steps:
      - name: Checkout tingly-box source code
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box
          ref: ${{ needs.setup.outputs.upstream_ref }}
          fetch-depth: 0
          submodules: true

      - name: Set up tag environment
        shell: bash
        run: |
          echo "RELEASE_TAG=${{ needs.setup.outputs.release_tag }}" >> $GITHUB_ENV
          echo "TAG_EXISTS=0" >> $GITHUB_ENV

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.goarch }}-
            ${{ runner.os }}-go-

      - name: Build Go binary (${{ matrix.suffix }})
        shell: bash
        run: |
          # Create build directory
          mkdir -p dist

          # Get build info
          VERSION="${{ env.RELEASE_TAG }}"
          GIT_COMMIT="$(git rev-parse HEAD 2>/dev/null || echo 'unknown')"
          BUILD_TIME="$(date -u '+%Y-%m-%d-%H-%M-%S' 2>/dev/null || echo 'unknown')"
          GO_VERSION="$(go version | awk '{print $3}' | sed 's/go//' 2>/dev/null || echo 'unknown')"
          PLATFORM="${{ matrix.goos }}/${{ matrix.goarch }}"

          # Build with optimized ldflags
          LDFLAGS="-s -w"
          LDFLAGS+=" -X main.version=${VERSION}"
          LDFLAGS+=" -X main.gitCommit=${GIT_COMMIT}"
          LDFLAGS+=" -X main.buildTime=${BUILD_TIME}"
          LDFLAGS+=" -X main.goVersion=${GO_VERSION}"
          LDFLAGS+=" -X main.platform=${PLATFORM}"

          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build \
            -ldflags="${LDFLAGS}" \
            -trimpath \
            -o ./dist/tingly-box${{ matrix.exe }} \
            ./cli/tingly-box

          # Make binary executable for non-Windows
          [ "${{ matrix.goos }}" != "windows" ] && chmod +x ./dist/tingly-box${{ matrix.exe }} || true

      - name: Install UPX 5.1.1
        if: matrix.goos != 'darwin'
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            choco install upx -y
          else
            wget -q https://github.com/upx/upx/releases/download/v5.1.1/upx-5.1.1-amd64_linux.tar.xz
            tar -xf upx-5.1.1-amd64_linux.tar.xz
          fi

      - name: Compress binary with UPX
        if: matrix.goos != 'darwin'
        shell: bash
        run: |
          if command -v upx &> /dev/null || [ -f "./upx-5.1.1-amd64_linux/upx" ]; then
            UPX_CMD="upx"
            [ -f "./upx-5.1.1-amd64_linux/upx" ] && UPX_CMD="./upx-5.1.1-amd64_linux/upx"
            $UPX_CMD --best --lzma ./dist/tingly-box${{ matrix.exe }} || \
            $UPX_CMD --best ./dist/tingly-box${{ matrix.exe }}
          fi

      - name: Upload build artifact (${{ matrix.suffix }})
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.suffix }}
          path: ./dist/tingly-box${{ matrix.exe }}
          retention-days: 7

  build-gui:
    needs: [setup, build-frontend]
    if: needs.setup.outputs.build_gui == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # macOS builds
          - os: macos-latest
            platform: macos
            arch: arm64
            goos: darwin
            goarch: arm64
          # Windows builds
          - os: windows-latest
            platform: windows
            arch: amd64
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout tingly-box source code
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box
          ref: ${{ needs.setup.outputs.upstream_ref }}
          fetch-depth: 0
          submodules: true

      - name: Set up tag environment
        shell: bash
        run: |
          echo "RELEASE_TAG=${{ needs.setup.outputs.release_tag }}" >> $GITHUB_ENV
          echo "TAG_EXISTS=0" >> $GITHUB_ENV

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/web/dist/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.goarch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.goarch }}-
            ${{ runner.os }}-go-

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.pnpm-store
            frontend/node_modules
          key: ${{ runner.os }}-pnpm-${{ matrix.goarch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-${{ matrix.goarch }}-
            ${{ runner.os }}-pnpm-

      - name: Install go-task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Install wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install frontend dependencies
        shell: bash
        run: |
          echo "@swc/core" | pnpm approve-builds
          pnpm install --frozen-lockfile
        working-directory: ./frontend

      - name: Run codegen
        run: task codegen

      - name: Install NSIS (Windows only)
        if: matrix.platform == 'windows'
        run: choco install nsis -y

      - name: Build Go binary (macOS)
        if: matrix.platform == 'macos'
        run: |
          task darwin:package

          mkdir -p dist

          cd bin
          ls -la .
          zip -r ../dist/tingly-box-gui-macos-arm64.zip TinglyBox.app
          cd ..

          cd dist
          ls -la .

      - name: Build Go binary (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          task windows:build PRODUCTION=true

          New-Item -ItemType Directory -Force -Path dist

          cd bin
          Get-ChildItem
          Compress-Archive -Path TinglyBox.exe -DestinationPath ../dist/tingly-box-gui-windows-amd64.zip
          cd ..

          cd dist
          Get-ChildItem

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./dist/
          retention-days: 7

  extract-changelog:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      changelog_exists: ${{ steps.extract.outputs.changelog_exists }}
    steps:
      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box
          ref: ${{ needs.setup.outputs.upstream_ref }}
          fetch-depth: 0

      - name: Extract changelog
        id: extract
        run: |
          UPSTREAM_REF="${{ needs.setup.outputs.upstream_ref }}"
          echo "Attempting to extract changelog for: $UPSTREAM_REF"

          # Try to get release notes if it's a tag
          if [[ "$UPSTREAM_REF" == v* ]]; then
            if gh release view "$UPSTREAM_REF" --repo tingly-dev/tingly-box >/dev/null 2>&1; then
              echo "📋 Found upstream release, extracting release notes..."
              gh release view "$UPSTREAM_REF" --repo tingly-dev/tingly-box --json body -q '.body' > upstream_changelog.md
              echo "changelog_exists=true" >> $GITHUB_OUTPUT
              echo "✅ Extracted release notes from upstream tag"
            else
              echo "⚠️ Upstream release not found, will generate from commits"
              echo "changelog_exists=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "ℹ️ Not a tag reference, will generate from commits"
            echo "changelog_exists=false" >> $GITHUB_OUTPUT
          fi

          # If no release notes found, generate from commit history
          if [ "${{ steps.extract.outputs.changelog_exists }}" != "true" ]; then
            echo "📝 Generating changelog from commit history..."
            {
              echo "## Recent Changes"
              echo ""
              echo "### Commits in \`${UPSTREAM_REF}\`"
              echo ""
            } > upstream_changelog.md

            # Get recent commits (last 20 for branches/commits, or since last tag)
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
              git log "${PREV_TAG}..${UPSTREAM_REF}" --pretty=format:"- %s (%h)" -20 >> upstream_changelog.md 2>/dev/null || \
              git log "${UPSTREAM_REF}" --pretty=format:"- %s (%h)" -20 >> upstream_changelog.md
            else
              git log "${UPSTREAM_REF}" --pretty=format:"- %s (%h)" -20 >> upstream_changelog.md
            fi
            echo "changelog_exists=true" >> $GITHUB_OUTPUT
          fi

          # Display extracted changelog
          echo "📋 Extracted Changelog:"
          cat upstream_changelog.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: upstream-changelog
          path: upstream_changelog.md
          retention-days: 7

  github-release:
    needs: [setup, build-cli, build-gui, extract-changelog]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.build-cli.result == 'success' &&
      needs.setup.result == 'success' &&
      (needs.build-gui.result == 'success' || needs.build-gui.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Checkout tingly-box-nightly repository
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box-nightly
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up tag environment
        run: |
          RELEASE_TAG="${{ needs.setup.outputs.release_tag }}"
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          echo "Release tag: $RELEASE_TAG"

      - name: Create git tag for nightly release
        run: |
          RELEASE_TAG="${{ needs.setup.outputs.release_tag }}"
          # Check if tag already exists
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists, skipping..."
          else
            echo "Creating tag: $RELEASE_TAG"
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Download CLI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cli-*
          path: ./dist/cli
          merge-multiple: false

      - name: Download GUI artifacts
        if: needs.setup.outputs.build_gui == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: gui-*
          path: ./dist/gui
          merge-multiple: false

      - name: Package binaries with proper extensions
        run: |
          # Save original directory and use absolute path for release
          ORIGINAL_DIR="$(pwd)"
          RELEASE_DIR="${ORIGINAL_DIR}/release"
          mkdir -p "$RELEASE_DIR"

          # Process CLI binaries - each artifact is in its own subdirectory
          if [ -d "dist/cli" ]; then
            for artifact_dir in dist/cli/cli-*; do
              if [ -d "$artifact_dir" ]; then
                # Extract platform from artifact directory name
                platform=$(basename "$artifact_dir" | sed 's/cli-//')
                chmod +x "$artifact_dir"/tingly-box* || true

                # Package the binary with platform suffix in zip filename
                binary=$(ls "$artifact_dir"/tingly-box* 2>/dev/null | head -1)
                if [ -n "$binary" ]; then
                  # Create zip with binary named "tingly-box" inside
                  tmp_dir=$(mktemp -d)
                  if [[ "$binary" == *.exe ]]; then
                    cp "$binary" "$tmp_dir/tingly-box.exe"
                    (cd "$tmp_dir" && zip -q -r "$RELEASE_DIR/tingly-box-${platform}.zip" tingly-box.exe)
                  else
                    cp "$binary" "$tmp_dir/tingly-box"
                    (cd "$tmp_dir" && zip -q -r "$RELEASE_DIR/tingly-box-${platform}.zip" tingly-box)
                  fi
                  rm -rf "$tmp_dir"
                fi
              fi
            done
          fi

          # Process GUI binaries (already zipped)
          if [ -d "dist/gui" ]; then
            for artifact_dir in dist/gui/gui-*; do
              if [ -d "$artifact_dir" ]; then
                cp "$artifact_dir"/*.zip "$RELEASE_DIR/" 2>/dev/null || true
              fi
            done
            find dist/gui -maxdepth 2 -name "*.zip" -exec cp {} "$RELEASE_DIR/" \; 2>/dev/null || true
          fi

          # Create checksums for all files (only if we have zip files)
          if ls "$RELEASE_DIR"/*.zip 1> /dev/null 2>&1; then
            (cd "$RELEASE_DIR" && sha256sum *.zip > checksums.txt)
          else
            echo "No zip files found in release directory"
          fi

      - name: Download changelog artifact
        uses: actions/download-artifact@v4
        with:
          name: upstream-changelog
          path: ./changelog
        continue-on-error: true

      - name: Create release notes
        run: |
          RELEASE_TAG="${{ needs.setup.outputs.release_tag }}"

          # Build release notes with changelog
          {
            echo "## 🌙 Nightly Release"
            echo ""
            echo "**Built from**: tingly-dev/tingly-box@${{ needs.setup.outputs.upstream_ref }} (commit: \`${{ needs.setup.outputs.tingly_box_commit }}\`)"
            echo ""
            echo "**Version**: \`$RELEASE_TAG\`"
            echo ""
            echo "### 📋 Upstream Changes"
            echo ""
          } > release_notes.md

          # Append upstream changelog if available
          if [ -f "changelog/upstream_changelog.md" ]; then
            cat "changelog/upstream_changelog.md" >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "*No changelog available*" >> release_notes.md
            echo "" >> release_notes.md
          fi

          # Add installation instructions
          {
            echo "### 🚀 Installation"
            echo ""
            echo '```bash'
            echo "# Use NPX (recommended)"
            echo "npx tingly-box-nightly@$RELEASE_TAG"
            echo ""
            echo "# Or install globally"
            echo "npm install -g tingly-box-nightly@$RELEASE_TAG"
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "_Automated nightly build from tingly-box-nightly_"
          } >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/*.zip
            release/checksums.txt
          body_path: release_notes.md
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-npx-publish:
    needs: [setup, github-release]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.github-release.result == 'success'
    permissions:
      contents: write
      actions: write
    steps:
      - name: Trigger NPX Publish workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NPM_VERSION="${{ needs.setup.outputs.npm_version }}"
          TRIGGER_CMD="gh workflow run npx-nightly.yml \
            --repo tingly-dev/tingly-box-nightly \
            --ref main \
            -f upstream_ref=\"${{ needs.setup.outputs.upstream_ref }}\" \
            -f release_tag=\"${{ needs.setup.outputs.release_tag }}\" \
            -f publish_cli=true \
            -f publish_gui=false \
            -f publish_bundle=false"

          # Add npm_version if it was explicitly provided
          if [ -n "$NPM_VERSION" ]; then
            TRIGGER_CMD="$TRIGGER_CMD -f npm_version=\"$NPM_VERSION\""
          fi

          eval $TRIGGER_CMD
          echo "✅ Triggered npx-nightly workflow"
