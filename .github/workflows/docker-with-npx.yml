name: Docker Image With NPX

on:
  schedule:
    # Run daily at 00:00 UTC for nightly builds
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Tingly-Box ref to build (commit, branch, or tag, e.g., main, v1.0.0, abc123). Leave empty to auto-fetch latest tag.'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Release tag (auto-generated format: 0.YYYYMMDD.HHmm-nightly+commit)'
        required: true
        type: string
      npm_version:
        description: 'NPM version to use (optional, defaults to release_tag value)'
        required: false
        type: string
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tingly-box-nightly
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout tingly-box-nightly repository
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box-nightly
          ref: main
          fetch-depth: 1

      - name: Fetch latest tag from tingly-box
        id: fetch_tag
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching latest tag from tingly-dev/tingly-box..."

          # Get latest matching tag (v* format, sorted by version)
          LATEST_TAG=$(gh api repos/tingly-dev/tingly-box/git/refs/tags \
            --jq '.[].ref' \
            --jq 'select(. | startswith("refs/tags/v"))' \
            | sed 's/refs\/tags\///g' \
            | sort -V | tail -1)

          if [ -z "$LATEST_TAG" ]; then
            echo "No tags found, falling back to main branch"
            echo "upstream_ref=main" >> $GITHUB_OUTPUT
          else
            echo "Latest tag: $LATEST_TAG"
            echo "upstream_ref=$LATEST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Determine upstream ref
        id: determine_ref
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Use fetched tag from previous step
            echo "upstream_ref=${{ steps.fetch_tag.outputs.upstream_ref }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_REF="${{ github.event.inputs.upstream_ref }}"
            if [ -z "$INPUT_REF" ]; then
              # Empty input, fetch latest tag
              echo "Fetching latest tag..."
              LATEST_TAG=$(gh api repos/tingly-dev/tingly-box/git/refs/tags \
                --jq '.[].ref' \
                --jq 'select(. | startswith("refs/tags/v"))' \
                | sed 's/refs\/tags\///g' \
                | sort -V | tail -1)
              if [ -z "$LATEST_TAG" ]; then
                echo "upstream_ref=main" >> $GITHUB_OUTPUT
              else
                echo "upstream_ref=$LATEST_TAG" >> $GITHUB_OUTPUT
              fi
            else
              echo "upstream_ref=$INPUT_REF" >> $GITHUB_OUTPUT
            fi
          else
            echo "upstream_ref=main" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout tingly-box source code
        uses: actions/checkout@v4
        with:
          repository: tingly-dev/tingly-box
          ref: ${{ steps.determine_ref.outputs.upstream_ref }}
          fetch-depth: 1
          path: upstream-tingly-box

      - name: Get commit hash
        id: get_commit
        run: |
          cd upstream-tingly-box
          COMMIT_HASH=$(git rev-parse --short=8 HEAD)
          echo "commit=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Determine release tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Scheduled nightly build - generate version
            NIGHTLY_DATE=$(date -u '+%Y%m%d')
            NIGHTLY_TIME=$(date -u '+%H%M')
            VERSION="0.${NIGHTLY_DATE}.${NIGHTLY_TIME}-nightly+${{ steps.get_commit.outputs.commit }}"
            echo "release_tag=$VERSION" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Use provided release_tag
            echo "release_tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          else
            # Fallback - generate version with commit hash
            NIGHTLY_DATE=$(date -u '+%Y%m%d')
            NIGHTLY_TIME=$(date -u '+%H%M')
            VERSION="0.${NIGHTLY_DATE}.${NIGHTLY_TIME}-nightly+${{ steps.get_commit.outputs.commit }}"
            echo "release_tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Validate and extract version
        id: version
        uses: ./.github/actions/validate-version
        with:
          release_tag: ${{ steps.determine_tag.outputs.release_tag }}
          npm_version: ${{ github.event.inputs.npm_version }}

      - name: Build and push Docker image
        uses: ./.github/actions/docker-build-push
        with:
          image_name: ${{ env.IMAGE_NAME }}
          version: ${{ steps.version.outputs.release_tag }}
          github_token: ${{ github.token }}
          build_args: |
            TINGLY_VERSION=${{ steps.version.outputs.npm_version }}
